name: Deploy ContaIA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          cp -R public/. dist/
          cp -R src dist/src
          cp -R data dist/data
          cp -R docs dist/docs
          # GitHub Pages serves this repository below /contaia-practicas-ia/.
          # Rewrite only application-root URLs; module-relative imports stay intact.
          sed -i 's#href="/#href="./#g; s#src="/#src="./#g' dist/index.html
          sed -i 's#href="/#href="./#g; s#href: "/#href: "./#g; s#"/data/#"./data/#g; s#"/docs/#"./docs/#g' dist/src/main.js dist/src/course.js
          printf '\n--- published files ---\n'
          find dist -maxdepth 3 -type f | sort | head -100

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
